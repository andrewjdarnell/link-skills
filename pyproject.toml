#   "tomli>=2.0.0; python_version < '3.11'",
# ]
# ///

[project]
name = "link-skills"
version = "2.0.0"
description = "Multi-repository skill linker for AI coding tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Andrew Darnell" },
]
keywords = ["ai", "skills", "claude", "kiro", "agent"]

dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
link-skills = "link_skills:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
